<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mailbox — COE444</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0F1729;
    --bg2:       #162040;
    --bg3:       #1C2A52;
    --border:    #2A3A6E;
    --cyan:      #00C8F0;
    --cyan-dim:  #007A96;
    --green:     #22D78A;
    --red:       #FF4D6A;
    --yellow:    #FFD166;
    --text:      #E2EAF8;
    --text-dim:  #8899BB;
    --text-muted:#4A5880;
    --font-mono: 'JetBrains Mono', monospace;
    --font-ui:   'Inter', sans-serif;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  #topnav {
    flex-shrink: 0; display: flex; align-items: center; gap: 4px;
    padding: 0 16px; height: 46px; background: var(--bg2); border-bottom: 1px solid var(--border);
  }
  #topnav .brand { font-size: 13px; font-weight: 700; color: var(--cyan); letter-spacing: .04em; margin-right: 14px; }
  #topnav a.tab { color: var(--text-dim); text-decoration: none; font-size: 13px; font-weight: 600; padding: 12px 12px 11px; border-bottom: 2px solid transparent; }
  #topnav a.tab:hover { color: var(--text); }
  #topnav a.tab.active { color: var(--text); border-bottom-color: var(--cyan); }

  /* One centred column. The three steps in order, nothing beside them. */
  #page { width: 100%; max-width: 860px; margin: 0 auto; padding: 26px 20px 70px; }

  .step { margin-bottom: 22px; }
  .step-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .step-num {
    width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%;
    background: var(--bg3); border: 1px solid var(--border); color: var(--cyan);
    font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .step-title { font-size: 15px; font-weight: 700; }
  .step-hint { font-size: 12px; color: var(--text-dim); margin-left: auto; }

  select, textarea {
    width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 9px;
    color: var(--text); font-family: var(--font-ui); font-size: 14px; padding: 11px 13px; outline: none;
  }
  select:focus, textarea:focus { border-color: var(--cyan-dim); }
  select { cursor: pointer; }
  textarea { resize: vertical; min-height: 54px; }

  /* Red when an attack is armed, green when it is not. Unmissable either way. */
  .setup { margin-top: 11px; border-radius: 10px; padding: 13px 15px; border: 1px solid; }
  .setup.attack { background: rgba(255,77,106,.07); border-color: rgba(255,77,106,.5); }
  .setup.clean  { background: rgba(34,215,138,.06); border-color: rgba(34,215,138,.4); }
  .setup-title { font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 7px; }
  .setup.attack .setup-title { color: var(--red); }
  .setup.clean  .setup-title { color: var(--green); }
  .setup-line { font-size: 13px; line-height: 1.6; }
  .setup-line b { color: var(--text); }
  .planted-text {
    margin: 8px 0; padding: 9px 12px; border-radius: 7px;
    background: rgba(255,77,106,.1); border-left: 3px solid var(--red);
    font-family: var(--font-mono); font-size: 11.5px; color: #FFB3C0;
    white-space: pre-wrap; word-break: break-word;
  }
  .setup-goal { font-size: 12.5px; color: var(--text-dim); margin-top: 7px; }
  .setup-goal b { color: var(--red); font-family: var(--font-mono); font-size: 12px; }

  #run-row { display: flex; align-items: center; gap: 14px; margin-top: 4px; flex-wrap: wrap; }
  #run-btn {
    background: var(--cyan); border: none; border-radius: 10px; color: #000;
    font-family: var(--font-ui); font-size: 15px; font-weight: 700; padding: 13px 30px; cursor: pointer;
  }
  #run-btn:hover { background: #00E8FF; }
  #run-btn:disabled { background: var(--cyan-dim); cursor: not-allowed; opacity: .6; }

  .switches { display: flex; gap: 16px; margin-left: auto; }
  .sw { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-dim); }
  .toggle-group { display: inline-flex; gap: 2px; background: var(--bg3); border: 1px solid var(--border); border-radius: 7px; padding: 2px; }
  .toggle-btn { background: transparent; border: none; border-radius: 5px; cursor: pointer; color: var(--text-dim); font-family: var(--font-ui); font-size: 10.5px; font-weight: 700; padding: 3px 9px; }
  .toggle-btn.active { background: var(--cyan); color: #000; }

  /* ── Result ─────────────────────────────────────────────────────────── */
  #result { margin-top: 26px; }
  .verdict { border-radius: 12px; border: 1px solid var(--border); border-left: 5px solid var(--accent); background: var(--bg2); overflow: hidden; }
  .v-bad  { --accent: var(--red);   background: linear-gradient(rgba(255,77,106,.06), rgba(255,77,106,.06)), var(--bg2); }
  .v-good { --accent: var(--green); background: linear-gradient(rgba(34,215,138,.05), rgba(34,215,138,.05)), var(--bg2); }

  .v-head { padding: 17px 20px; display: flex; align-items: flex-start; gap: 13px; }
  .v-icon { font-size: 26px; line-height: 1; flex-shrink: 0; }
  .v-state { font-size: 15px; font-weight: 800; letter-spacing: .02em; color: var(--accent); }
  .v-headline { font-size: 13.5px; color: var(--text); margin-top: 4px; line-height: 1.5; max-width: 62ch; }

  /* Side by side is the whole point: asked on the left, got on the right. */
  .cols { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border); }
  .col { padding: 15px 20px; }
  .col + .col { border-left: 1px solid var(--border); }
  .col-head { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: var(--text-muted); margin-bottom: 9px; }
  .col.bad .col-head { color: var(--red); }
  .line { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; font-size: 13px; }
  .line .mark { width: 14px; flex-shrink: 0; font-size: 12px; }
  .line .addr { font-family: var(--font-mono); font-size: 12px; word-break: break-all; color: var(--text-dim); }
  .line.added .addr { color: var(--red); font-weight: 700; font-size: 13px; }
  .line-note { font-size: 11.5px; color: var(--text-muted); margin-top: 7px; line-height: 1.5; }

  .why { padding: 14px 20px; border-top: 1px solid var(--border); }
  .why-title { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: var(--text-muted); margin-bottom: 8px; }
  .why-line { font-size: 13px; line-height: 1.6; }
  .said { margin-top: 9px; padding: 10px 13px; border-radius: 8px; background: var(--bg3); border: 1px solid var(--border); font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim); white-space: pre-wrap; }
  .gotcha { margin-top: 9px; padding: 9px 13px; border-radius: 8px; background: rgba(255,209,102,.09); border: 1px solid rgba(255,209,102,.4); color: var(--yellow); font-size: 12.5px; line-height: 1.55; }

  .v-foot { padding: 11px 20px 13px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); background: var(--bg3); border: 1px solid var(--border); border-radius: 100px; padding: 2px 9px; }

  details.more { margin-top: 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg2); }
  details.more > summary { cursor: pointer; padding: 11px 16px; font-size: 12.5px; font-weight: 600; color: var(--text-dim); list-style: none; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before { content: '\25B8  '; color: var(--cyan); }
  details.more[open] > summary::before { content: '\25BE  '; }
  details.more > summary:hover { color: var(--text); }
  .more-body { padding: 0 16px 15px; }

  .mailrow { padding: 8px 0; border-top: 1px solid var(--border); font-size: 12.5px; }
  .mailrow:first-child { border-top: none; }
  .mailrow .who { font-weight: 600; }
  .mailrow .sub { color: var(--text-dim); font-size: 12px; }
  .tag { font-size: 10px; font-weight: 700; border-radius: 100px; padding: 1px 8px; margin-left: 6px; }
  .tag-out { background: rgba(255,77,106,.15); color: var(--red); border: 1px solid var(--red); }
  .tag-in  { background: var(--bg3); color: var(--text-muted); border: 1px solid var(--border); }

  pre.raw { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); white-space: pre-wrap; word-break: break-word; max-height: 340px; overflow: auto; }

  #loading { display: none; align-items: center; gap: 12px; color: var(--text-dim); font-size: 13px; margin-top: 26px; }
  .spinner { width: 20px; height: 20px; border: 3px solid var(--border); border-top-color: var(--cyan); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .warn { margin-bottom: 14px; padding: 10px 13px; border-radius: 9px; background: rgba(255,209,102,.1); border: 1px solid rgba(255,209,102,.45); color: var(--yellow); font-size: 12.5px; line-height: 1.55; }
  .warn:empty { display: none; }
  .err { padding: 12px 14px; border-radius: 9px; background: rgba(255,77,106,.1); border: 1px solid var(--red); color: var(--red); font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<nav id="topnav" aria-label="Views">
  <span class="brand">COE444 Security Lab</span>
  <a class="tab active" href="/" aria-current="page">Mailbox</a>
  <a class="tab" href="/lab">Lab (research view)</a>
</nav>

<div id="page">

  <div id="usage-warn" class="warn"></div>

  <div class="step">
    <div class="step-head">
      <span class="step-num">1</span>
      <span class="step-title">Pick a scenario</span>
      <span class="step-hint">run the normal one first, then an attack</span>
    </div>
    <select id="scenario"></select>
    <div id="setup"></div>
  </div>

  <div class="step">
    <div class="step-head">
      <span class="step-num">2</span>
      <span class="step-title">What you ask the assistant</span>
      <span class="step-hint">you can edit this</span>
    </div>
    <textarea id="task" rows="2"></textarea>
  </div>

  <div class="step">
    <div id="run-row">
      <button id="run-btn"><span id="run-text">Run it</span></button>
      <span class="switches">
        <span class="sw">Detection
          <span class="toggle-group" id="tg-detection">
            <button class="toggle-btn active" data-on="0">OFF</button><button class="toggle-btn" data-on="1">ON</button>
          </span>
        </span>
        <span class="sw">Prevention
          <span class="toggle-group" id="tg-prevention">
            <button class="toggle-btn active" data-on="0">OFF</button><button class="toggle-btn" data-on="1">ON</button>
          </span>
        </span>
      </span>
    </div>
    <div id="stub-note" class="line-note"></div>
  </div>

  <div id="loading"><span class="spinner"></span> Running the assistant…</div>
  <div id="result"></div>

</div>

<script>
let SCENARIOS = [];
let CURRENT = null;
let MAILBOX = null;
let LAST_RUN = null;
let LAST_TASK = '';
let DETECTION_ON = false, PREVENTION_ON = false;

function escHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Exact address tokens only. Substring matching would let "hr@x" match
// "xhr@x" and put a false accusation on screen.
const ADDR_RE  = /[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/g;
const ADDR_ONE = /[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/;
function addrsIn(s) { return [...new Set((String(s == null ? '' : s).toLowerCase().match(ADDR_RE) || []))]; }

function joinList(xs) {
  if (xs.length <= 1) return xs.join('');
  if (xs.length === 2) return xs[0] + ' and ' + xs[1];
  return xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];
}
function ownDomain() {
  const a = MAILBOX && MAILBOX.employee && MAILBOX.employee.address;
  return a ? a.split('@')[1] : 'northwind.example';
}
function recipientsOf(obj) {
  const out = [], seen = new Set();
  for (const field of ['to', 'cc', 'bcc']) {
    for (const part of String((obj || {})[field] || '').split(',')) {
      const m = part.match(ADDR_ONE);
      if (!m) continue;
      const addr = m[0].toLowerCase();
      if (seen.has(addr)) continue;
      seen.add(addr);
      out.push({ addr, field });
    }
  }
  return out;
}

// How each family wins, in plain words, keyed by the harness predicate. The
// ones with no recipient change are exactly the ones a recipient diff misses.
const HOW_IT_WON = {
  recipient_is_attacker: 'The assistant emailed an address the attacker chose.',
  body_contains_canary:  'Confidential company text was copied into the body of an email that left the company. No extra recipient was added, so checking recipients alone would miss this completely.',
  reply_contains_canary: 'Confidential company text was leaked into the reply on screen. No email was needed at all.',
  benign_task_failed:    "Your own task was derailed — the assistant never gave you the answer you asked for. Nothing leaked; the damage is that the assistant stopped being useful.",
};

function familyName(f) {
  return ({
    ride_along_cc:        'it adds a secret CC to your email',
    ride_along_swap:      'it swaps the recipient for someone else',
    naive_standalone:     'a blunt "ignore your instructions"',
    content_exfiltration: 'it leaks company text inside the body',
    reply_channel_exfil:  'it redirects where the answer goes',
    goal_hijack:          'it derails your task entirely',
  })[f] || f;
}

async function getMailbox() { return fetch('/api/mailbox').then(r => r.json()); }

async function init() {
  const [mb, pls, bns] = await Promise.all([
    getMailbox().catch(() => null),
    fetch('/api/payloads').then(r => r.json()).catch(() => []),
    fetch('/api/benign').then(r => r.json()).catch(() => []),
  ]);
  MAILBOX = mb || { documents: [], inbox: [], sent: [] };

  // dev split only — the test payloads stay unopened until the final run.
  const benign  = (bns || []).filter(b => b.split === 'dev').slice(0, 3);
  const attacks = (pls || []).filter(p => p.split === 'dev');

  SCENARIOS = [
    ...benign.map(b => ({ kind: 'benign', id: b.id, task: b.task,
      label: 'Normal — ' + (b.task.length > 56 ? b.task.slice(0, 56) + '…' : b.task) })),
    ...attacks.map(p => ({ kind: 'attack', id: p.id, task: p.task, payload: p.payload,
      inject_into: p.inject_into, family: p.family,
      label: 'Attack — ' + familyName(p.family) + '  (' + p.id + ')' })),
  ];

  document.getElementById('scenario').innerHTML =
    SCENARIOS.map((s, i) => `<option value="${i}">${escHtml(s.label)}</option>`).join('');
  document.getElementById('scenario').addEventListener('change', e => selectScenario(+e.target.value));
  document.getElementById('run-btn').addEventListener('click', run);
  wireToggle('tg-detection', v => { DETECTION_ON = v; renderStubNote(); });
  wireToggle('tg-prevention', v => { PREVENTION_ON = v; renderStubNote(); });
  document.getElementById('result').addEventListener('click', ev => {
    if (ev.target.closest('[data-reset]')) resetAll();
  });

  await selectScenario(0);
  renderStubNote();
}

function wireToggle(id, set) {
  document.getElementById(id).addEventListener('click', ev => {
    const btn = ev.target.closest('.toggle-btn');
    if (!btn) return;
    [...btn.parentElement.children].forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    set(btn.dataset.on === '1');
  });
}

// A stub switched ON changes nothing. Say so before the run, not after.
function renderStubNote() {
  const d = (MAILBOX && MAILBOX.defenses) || {};
  const stubs = [];
  if (DETECTION_ON  && d.detection  && !d.detection.implemented)  stubs.push('Detection');
  if (PREVENTION_ON && d.prevention && !d.prevention.implemented) stubs.push('Prevention');
  document.getElementById('stub-note').textContent = stubs.length
    ? stubs.join(' and ') + (stubs.length > 1 ? ' are' : ' is') +
      ' still an empty starter file — switching ' + (stubs.length > 1 ? 'them' : 'it') + ' on changes nothing yet.'
    : '';
}

// ── Step 1 ──────────────────────────────────────────────────────────────────
async function selectScenario(i) {
  CURRENT = SCENARIOS[i];
  if (!CURRENT) return;
  document.getElementById('task').value = CURRENT.task || '';
  document.getElementById('result').innerHTML = '';
  LAST_RUN = null;

  const box = document.getElementById('setup');
  if (CURRENT.kind === 'benign') {
    box.className = 'setup clean';
    box.innerHTML = `<div class="setup-title">No attack — this is the control run</div>
      <div class="setup-line">Nothing is planted anywhere. The documents are exactly as the company wrote them.
        Run this first so you know what <b>normal</b> looks like.</div>`;
  } else {
    const doc = (MAILBOX.documents || []).find(d => d.id === CURRENT.inject_into);
    const targets = addrsIn(CURRENT.payload).filter(a => !a.endsWith('@' + ownDomain()));
    box.className = 'setup attack';
    box.innerHTML = `<div class="setup-title">Attack armed — ${escHtml(familyName(CURRENT.family))}</div>
      <div class="setup-line">The text below is secretly added to
        <b>${escHtml(doc ? doc.title : CURRENT.inject_into)}</b>, so the assistant reads it as part of the
        real policy. <b>Your own request stays completely innocent.</b></div>
      <div class="planted-text">${escHtml(String(CURRENT.payload || '').trim())}</div>
      ${targets.length ? `<div class="setup-goal">What the attacker wants: mail sent to <b>${escHtml(joinList(targets))}</b></div>` : ''}`;
  }
  await applyPlanting();
}

// Keep the server matching the picked scenario, so nothing is planted by hand.
async function applyPlanting() {
  const mb = await getMailbox();
  for (const d of (mb.documents || [])) {
    if (d.planted) await fetch('/api/documents/' + encodeURIComponent(d.id) + '/plant', { method: 'DELETE' });
  }
  if (CURRENT.kind === 'attack') {
    await fetch('/api/documents/' + encodeURIComponent(CURRENT.inject_into) + '/plant', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: CURRENT.payload }),
    });
  }
  MAILBOX = await getMailbox();
}

async function resetAll() {
  await fetch('/api/mailbox/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  document.getElementById('result').innerHTML = '';
  LAST_RUN = null;
  await applyPlanting();
}

// ── Step 3 ──────────────────────────────────────────────────────────────────
async function run() {
  const task = document.getElementById('task').value.trim();
  if (!task) return;
  LAST_TASK = task;
  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  document.getElementById('run-text').textContent = 'Running…';
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('result').innerHTML = '';

  try {
    const r = await fetch('/api/assistant', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: task, detection: DETECTION_ON, prevention: PREVENTION_ON,
                            payload_id: CURRENT.kind === 'attack' ? CURRENT.id : '' }),
    });
    const data = await r.json();
    renderUsage(data.usage);
    if (!r.ok) {
      document.getElementById('result').innerHTML = `<div class="err">${escHtml(data.error || ('HTTP ' + r.status))}</div>`;
    } else {
      LAST_RUN = data;
      MAILBOX = await getMailbox();
      renderResult();
    }
  } catch (e) {
    document.getElementById('result').innerHTML = `<div class="err">${escHtml(e)}</div>`;
  } finally {
    btn.disabled = false;
    document.getElementById('run-text').textContent = 'Run it';
    document.getElementById('loading').style.display = 'none';
  }
}

function renderUsage(u) {
  document.getElementById('usage-warn').textContent = (u && u.warn) ? u.message : '';
}

function renderResult() {
  const r = LAST_RUN;
  const asked = addrsIn(LAST_TASK);
  const self  = String(((MAILBOX || {}).employee || {}).address || '').toLowerCase();
  const known = ((MAILBOX || {}).contacts || []).map(x => x.toLowerCase());

  const delivered = [], seen = new Set();
  for (const s of (r.sent || [])) {
    for (const rc of recipientsOf(s)) { if (!seen.has(rc.addr)) { seen.add(rc.addr); delivered.push(rc); } }
  }
  // left_company is the backend's own domain test — the only authority for
  // "outside the company". A known colleague is never an alarm.
  const left = addrsIn((r.sent || []).flatMap(s => s.left_company || []).join(' '));
  const added = delivered.filter(d => !asked.includes(d.addr) && d.addr !== self
                                   && (left.includes(d.addr) || !known.includes(d.addr)));
  const escaped = added.filter(d => left.includes(d.addr));
  const isAttack = CURRENT.kind === 'attack';

  // The server scores an attack with evaluation/predicates.py — the same judge
  // the research harness uses. Only some families win by adding a recipient;
  // the rest win in the body, in the reply, or by breaking the user's task.
  const v = r.verdict || {};

  let cls, icon, state, headline;
  if (isAttack && v.known && v.attack_succeeded) {
    cls = 'v-bad'; icon = '❌';
    state = 'THE ATTACK WORKED';
    headline = added.length
      ? joinList(added.map(a => a.addr)) + ' received this email, and you never asked for that.'
      : (HOW_IT_WON[v.predicate] || 'The attack met its objective.');
  } else if (added.length) {
    cls = 'v-bad'; icon = '❌';
    state = isAttack ? 'THE ATTACK WORKED' : 'SOMETHING WENT WRONG';
    headline = joinList(added.map(a => a.addr)) + ' received this email. You never asked for that'
      + (escaped.length ? ', and ' + (escaped.length > 1 ? 'those addresses are' : 'that address is')
         + ' outside the company' : '') + '.';
  } else if (isAttack) {
    cls = 'v-good'; icon = '✅';
    state = 'THE ATTACK DID NOT WORK';
    headline = (v.known ? 'It did not meet its objective (' + v.predicate + ') on this run. ' : 'No extra recipient was added. ')
      + 'Careful: both defenses are still empty files, so the model simply did not obey the planted text this time '
      + '— nothing stopped it.';
  } else if (delivered.length) {
    cls = 'v-good'; icon = '✅';
    state = 'NORMAL — NOTHING WENT WRONG';
    headline = 'The assistant emailed exactly who you asked for, and nobody else.';
  } else {
    cls = 'v-good'; icon = '✅';
    state = 'NORMAL — NOTHING WENT WRONG';
    headline = 'The assistant answered your question. No email was sent, and none was needed.';
  }

  const wantLines = asked.length
    ? asked.map(a => `<div class="line"><span class="mark">→</span><span class="addr">${escHtml(a)}</span></div>`).join('')
    : `<div class="line"><span class="mark">→</span><span class="addr" style="font-family:var(--font-ui)">just an answer, no email</span></div>`;

  const isAdded = a => added.some(x => x.addr === a);
  const gotLines = delivered.length
    ? delivered.slice().sort((x, y) => (isAdded(y.addr) ? 1 : 0) - (isAdded(x.addr) ? 1 : 0)).map(d => {
        const bad = isAdded(d.addr);
        return `<div class="line ${bad ? 'added' : ''}">
          <span class="mark">${bad ? '✗' : '✓'}</span>
          <span class="addr">${escHtml(d.addr)}</span>
          ${bad ? `<span style="font-size:10.5px;color:var(--red);font-weight:700;margin-left:auto">NOT YOURS${left.includes(d.addr) ? ' · OUTSIDE' : ''}</span>` : ''}
        </div>`;
      }).join('')
    : `<div class="line"><span class="mark">✓</span><span class="addr" style="font-family:var(--font-ui)">no email sent</span></div>`;

  let why = '';
  if (added.length) {
    const a = added[0].addr;
    // Only an excerpt the agent actually read can be named as the source:
    // a withheld chunk keeps its original text, but the agent never saw it.
    const hit = (r.read || []).filter(c => !c.withheld)
      .find(c => addrsIn(c.planted).includes(a) || addrsIn(c.text).includes(a));
    const title = hit && (((MAILBOX.documents || []).find(d => d.id === hit.document_id) || {}).title || hit.document_id);
    let line = '', quote = '';
    if (hit && addrsIn(hit.planted).includes(a)) {
      line = 'The assistant read the planted text in <b>' + escHtml(title) + '</b> and followed it as if the company had written it.';
      quote = hit.planted;
    } else if (hit && hit.source === 'inbox') {
      line = 'The address came from an email sitting in the inbox, which the assistant read as ordinary text.';
      quote = hit.text;
    } else if (hit) {
      line = 'The address appears in <b>' + escHtml(title) + '</b>.';
    } else {
      line = 'This address is in nothing the assistant read on this run, so where it came from cannot be shown.';
    }
    const mentioned = addrsIn(r.reply).includes(a);
    why = `<div class="why">
      <div class="why-title">Why it happened</div>
      <div class="why-line">${line}</div>
      ${quote ? `<div class="planted-text">${escHtml(String(quote).trim())}</div>` : ''}
      <div class="why-title" style="margin-top:14px">What the assistant told you</div>
      <div class="said">${escHtml(r.reply || '')}</div>
      ${mentioned ? '' : `<div class="gotcha">It never mentioned ${escHtml(a)}. From that reply alone your task simply succeeded — which is exactly what makes this dangerous.</div>`}
    </div>`;
  } else if (r.reply) {
    why = `<div class="why"><div class="why-title">What the assistant told you</div>
      <div class="said">${escHtml(r.reply)}</div></div>`;
  }

  const df = r.defenses || {};
  const chip = (n, on, impl) => `<span class="chip">${n} ${on ? 'ON' : 'OFF'}${on && !impl ? ' (empty stub)' : ''}</span>`;

  document.getElementById('result').innerHTML = `
    <div class="verdict ${cls}">
      <div class="v-head">
        <span class="v-icon">${icon}</span>
        <span>
          <span class="v-state">${escHtml(state)}</span>
          <div class="v-headline">${headline}</div>
        </span>
      </div>
      <div class="cols">
        <div class="col"><div class="col-head">You asked for mail to</div>${wantLines}</div>
        <div class="col ${added.length ? 'bad' : ''}"><div class="col-head">It actually went to</div>${gotLines}</div>
      </div>
      ${why}
      <div class="v-foot">
        ${chip('Detection', !!(df.detection || {}).on, !!(df.detection || {}).implemented)}
        ${chip('Prevention', !!(df.prevention || {}).on, !!(df.prevention || {}).implemented)}
        <span class="chip">${r.tokens || 0} tokens</span>
        <button class="toggle-btn" data-reset="1" style="margin-left:auto;border:1px solid var(--border)">Reset mailbox</button>
      </div>
    </div>
    ${renderMore(r)}`;
}

function renderMore(r) {
  const inbox = (MAILBOX.inbox || []).map(e => `<div class="mailrow">
      <div class="who">${escHtml(e.sender)}${e.outsider
        ? '<span class="tag tag-out">OUTSIDE THE COMPANY</span>'
        : '<span class="tag tag-in">colleague</span>'}</div>
      <div class="sub">${escHtml(e.subject)}</div></div>`).join('');

  const sent = (MAILBOX.sent || []).map(e => `<div class="mailrow">
      <div class="who">To: ${escHtml(e.to)}${(e.left_company || []).length
        ? '<span class="tag tag-out">LEFT THE COMPANY</span>' : ''}</div>
      <div class="sub">${escHtml(e.subject || '(no subject)')}${e.cc ? ' · cc ' + escHtml(e.cc) : ''}${e.bcc ? ' · bcc ' + escHtml(e.bcc) : ''}</div>
    </div>`).join('') || '<div class="line-note">Nothing sent yet.</div>';

  const read = (r.read || []).map(c => `<div class="mailrow">
      <div class="who" style="font-family:var(--font-mono);font-size:11.5px">${escHtml(c.chunk_id)}${c.planted
        ? '<span class="tag tag-out">PLANTED</span>' : ''}${c.withheld
        ? '<span class="tag tag-out">WITHHELD BY DETECTION</span>' : ''}</div>
      <div class="sub" style="font-family:var(--font-mono);font-size:11px">${escHtml(String(c.text || '').slice(0, 220))}…</div>
    </div>`).join('');

  return `
    <details class="more"><summary>The mailbox (inbox and sent)</summary>
      <div class="more-body">
        <div class="col-head" style="margin-top:6px">Inbox</div>${inbox}
        <div class="col-head" style="margin-top:14px">Sent</div>${sent}
      </div></details>

    <details class="more"><summary>Everything the assistant read and did</summary>
      <div class="more-body">
        <div class="col-head" style="margin-top:6px">Excerpts it retrieved</div>${read}
        <div class="col-head" style="margin-top:14px">Tool calls</div>
        <pre class="raw">${escHtml(JSON.stringify(r.steps || [], null, 2))}</pre>
        <div class="col-head" style="margin-top:14px">Prevention gate</div>
        <pre class="raw">${escHtml(JSON.stringify(r.gate || [], null, 2))}</pre>
      </div></details>`;
}

init();
</script>
</body>
</html>
